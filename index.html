<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Violín Móvil</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loader" aria-hidden="false">
  <div class="loader-inner">
    <div class="logo">🎻</div>
    <div class="loader-text">Violín Móvil</div>
  </div>
</div>

<div id="app">
  <div class="neck-wrap">
    <div class="violin-body">
      <div class="strings">
        <!-- Strings / columns will be generated by JS -->
      </div>
      <div class="bridge"></div>
    </div>
  </div>

  <!-- gear button to open settings -->
  <button id="settings-btn" aria-label="Ajustes" class="gear" title="Ajustes"></button>

  <!-- settings panel (temporary overlay) -->
  <div id="settings-panel" class="settings-panel" aria-hidden="true">
    <div class="settings-header">
      <strong>Ajustes de notas</strong>
      <button id="close-settings" class="close" aria-label="Cerrar">✕</button>
    </div>
    <div class="settings-body">
      <label class="setting-item"><input type="checkbox" id="show-natural" checked> Natural</label>
      <label class="setting-item"><input type="checkbox" id="show-sharp" checked> Sostenido (#)</label>
      <label class="setting-item"><input type="checkbox" id="show-flat" checked> Bemol (b)</label>

      <hr style="border:none;border-top:1px solid rgba(0,0,0,0.06);margin:8px 0">

      <div class="metronome-section">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <label class="setting-item" style="margin:0"><input type="checkbox" id="metronome-on"> Metronomo</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="metronome-bpm" type="number" min="30" max="240" value="90" style="width:64px;padding:6px;border-radius:8px;border:1px solid rgba(0,0,0,0.06)">
            <span style="font-size:13px;color:#666">BPM</span>
          </div>
        </div>
        <input id="metronome-slider" type="range" min="30" max="240" value="90" style="width:100%;margin-top:8px">
        <div class="settings-note-help" style="margin-top:6px">Sonido de tick estándar; activa para marcar tempo.</div>
      </div>

      <div class="settings-note-help" style="margin-top:10px">Strings: G - D - A - E (izquierda → derecha)</div>
    </div>
  </div>

  <div class="legend"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
